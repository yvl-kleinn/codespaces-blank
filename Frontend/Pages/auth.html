<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitForge | Login</title>
    <link rel="stylesheet" href="../Styles/auth.css" />
  </head>
  <body>
    <div class="container">
      <div class="auth-wrap">
        <section class="panel">
          <h1>Welcome back</h1>
          <p>Sign in to continue your fitness journey with custom plans and daily reminders.</p>
          <form>
            <input type="email" placeholder="Email address" />
            <input type="password" placeholder="Password" />
            <button type="submit">Login</button>
          </form>
          <p class="small">New here? Create an account to start tracking progress.</p>
        </section>

        <section class="panel">
          <h2>Create account</h2>
          <p>Join thousands of members building strength every week.</p>
          <form>
            <input type="text" placeholder="Full name" />
            <input type="email" placeholder="Email address" />
            <input type="password" placeholder="Choose password" />
            <button type="submit">Sign up</button>
          </form>
          <p class="small"><span class="highlight">Free starter plan</span> included.</p>
        </section>
      </div>
    </div>
  </body>
</html>
